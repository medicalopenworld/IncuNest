name: Release Firmware

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

# Desde el porte a ESP-IDF (2026-09) las dos placas construyen con idf.py.
# La accion oficial de Espressif trae la ESP-IDF de la version indicada ya
# instalada (imagen docker espressif/idf:<version>), asi que no hay que
# instalar toolchains a mano. La version tiene que ser LA MISMA que la del
# equipo de desarrollo y que la de la SensorBoard: v6.0.1.
#
# HW_NUM: el build por defecto es la revision 17 (Kconfig
# INCUNEST_HW_NUM default 17), igual que antes se publicaba IncuNest_V17.

jobs:
  release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build motherboard firmware (ESP-IDF v6.0.1)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32s3
          path: Firmware/motherBoard

      - name: Build Display HMI firmware (ESP-IDF v6.0.1)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32s3
          path: Firmware/Display_HMI

      # Los nombres de los assets se conservan tal cual: el flasher los
      # descarga por estos nombres desde la ultima release.
      - name: Stage release assets
        run: |
          mkdir release_assets
          cp Firmware/motherBoard/build/bootloader/bootloader.bin              release_assets/motherboard_bootloader.bin
          cp Firmware/motherBoard/build/partition_table/partition-table.bin    release_assets/motherboard_partitions.bin
          cp Firmware/motherBoard/build/motherboard.bin                        release_assets/motherboard_firmware.bin
          cp Firmware/motherBoard/build/ota_data_initial.bin                   release_assets/motherboard_ota_data_initial.bin
          cp Firmware/Display_HMI/build/bootloader/bootloader.bin              release_assets/display_hmi_bootloader.bin
          cp Firmware/Display_HMI/build/partition_table/partition-table.bin    release_assets/display_hmi_partitions.bin
          cp Firmware/Display_HMI/build/display_hmi.bin                        release_assets/display_hmi_firmware.bin
          cp Firmware/Display_HMI/build/ota_data_initial.bin                   release_assets/display_hmi_ota_data_initial.bin

      - name: Generate manifest.json
        run: |
          python3 - <<'EOF'
          import json, hashlib, os
          from pathlib import Path

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          tag = os.environ["GITHUB_REF_NAME"]
          assets_dir = Path("release_assets")
          files = {f.name: sha256(f) for f in sorted(assets_dir.iterdir()) if f.is_file()}
          manifest = {"release": tag, "files": files}
          (assets_dir / "manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
