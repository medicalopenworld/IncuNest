name: Release Firmware

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('Firmware/motherBoard/platformio.ini', 'Firmware/Display_HMI/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # motherBoard V18 y V19. El flasher elige una u otra por el hardware de la
      # placa (eFuse de PSRAM: V18 N8 sin PSRAM, V19 N8R2 con 2 MB), asi que
      # las dos van en la release con nombres distintos. La V17 ya no se
      # publica: por hardware no se distingue de la V18 y el flasher solo
      # soporta V18/V19. Los entornos _bench y _factory nunca se compilan aqui.
      - name: Build motherboard firmware (V18 y V19)
        run: pio run -e IncuNest_V18 -e IncuNest_V19
        working-directory: Firmware/motherBoard

      - name: Build Display HMI firmware
        run: pio run -e main
        working-directory: Firmware/Display_HMI

      - name: Stage release assets
        run: |
          mkdir release_assets
          # V18 con los nombres de siempre (motherboard_*): un flasher antiguo
          # sigue bajando la V18 y nunca graba la V19.
          cp Firmware/motherBoard/.pio/build/IncuNest_V18/bootloader.bin release_assets/motherboard_bootloader.bin
          cp Firmware/motherBoard/.pio/build/IncuNest_V18/partitions.bin release_assets/motherboard_partitions.bin
          cp Firmware/motherBoard/.pio/build/IncuNest_V18/firmware.bin   release_assets/motherboard_firmware.bin
          # V19 (flasher/updater.py la baja a data/firmware/motherboard_hw19/).
          cp Firmware/motherBoard/.pio/build/IncuNest_V19/bootloader.bin release_assets/motherboard_hw19_bootloader.bin
          cp Firmware/motherBoard/.pio/build/IncuNest_V19/partitions.bin release_assets/motherboard_hw19_partitions.bin
          cp Firmware/motherBoard/.pio/build/IncuNest_V19/firmware.bin   release_assets/motherboard_hw19_firmware.bin
          cp Firmware/Display_HMI/.pio/build/main/bootloader.bin         release_assets/display_hmi_bootloader.bin
          cp Firmware/Display_HMI/.pio/build/main/partitions.bin         release_assets/display_hmi_partitions.bin
          cp Firmware/Display_HMI/.pio/build/main/firmware.bin           release_assets/display_hmi_firmware.bin
          cp Firmware/Display_HMI/.pio/build/main/ota_data_initial.bin   release_assets/display_hmi_ota_data_initial.bin 2>/dev/null || true

      - name: Generate manifest.json
        run: |
          python3 - <<'EOF'
          import json, hashlib, os
          from pathlib import Path

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          tag = os.environ["GITHUB_REF_NAME"]
          assets_dir = Path("release_assets")
          files = {f.name: sha256(f) for f in sorted(assets_dir.iterdir()) if f.is_file()}
          manifest = {"release": tag, "files": files}
          (assets_dir / "manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
