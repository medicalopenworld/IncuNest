[common]
platform = espressif32@6.6.0
framework = arduino
board = esp32-s3-devkitc-1
board_build.partitions = partitions/ESP32S3_8MB.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_encoding = UTF-8
build_type = debug
debug_tool = esp-prog
debug_init_break = tbreak setup
; NOTE: lib_extra_dirs = ../shared treats shared/'s SUBFOLDERS (include/,
; src/) as candidate libraries — headers resolved via an anonymous "include"
; pseudo-lib, but shared/src/*.cpp never got compiled/linked. symlink:// makes
; shared/ itself the library so library.json (srcDir=src) is honored.
lib_deps =
  symlink://../shared
  https://github.com/br3ttb/Arduino-PID-Library.git
  https://github.com/mathertel/RotaryEncoder.git
  https://github.com/adafruit/Adafruit-GFX-Library.git
  https://github.com/adafruit/Adafruit_BusIO.git
  https://github.com/sparkfun/SparkFun_SHTC3_Arduino_Library.git
  https://github.com/thingsboard/thingsboard-arduino-sdk.git#v0.13.0
  https://github.com/bblanchon/ArduinoStreamUtils.git
  https://github.com/vshymanskyy/TinyGSM.git
  https://github.com/vshymanskyy/StreamDebugger.git
  https://github.com/RobTillaart/TCA9555.git
  https://github.com/adafruit/Adafruit_SHT4X.git
  https://github.com/tttapa/Arduino-Filters.git
  https://github.com/medicalopenworld/incunest_afe4490.git#master
  https://github.com/arduino-libraries/ArduinoHttpClient.git
  https://github.com/Bodmer/TFT_eSPI.git
  https://github.com/ricemices/ArduinoHttpClient.git
  https://github.com/Sensirion/arduino-i2c-sts3x.git
  https://github.com/beast-devices/Arduino-INA3221.git
  bblanchon/ArduinoJson@6.21.5
  thingsboard/TBPubSubClient@2.9.4

[env:IncuNest_V18]
extends = common
build_flags =
    -DHW_NUM=18
    -DCORE_DEBUG_LEVEL=3
    -g3 -O0

    -DUSER_SETUP_LOADED=1
    -DTFT_INVERSION_ON=1
    -DILI9341_2_DRIVER=1
    -DTFT_MISO=46 -DTFT_MOSI=46 -DTFT_SCLK=46
    -DTFT_CS=46 -DTFT_DC=46 -DTFT_RST=-1 -DTOUCH_CS=-1
    -DLOAD_GLCD=1 -DSPI_FREQUENCY=27000000
    -DBQ25730_TEST
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I./include
    -I./include/config
    -I./include/protocol
    -I./include/tasks
    -Isrc/drivers
    -Wno-attributes
build_src_filter = +<*> -<hal/hal_hw16.cpp>

[env:IncuNest_V17]
extends = common
build_flags =
    -DHW_NUM=17
    -DCORE_DEBUG_LEVEL=3
    -g3 -O0

    -DUSER_SETUP_LOADED=1
    -DTFT_INVERSION_ON=1
    -DILI9341_2_DRIVER=1
    -DTFT_MISO=46 -DTFT_MOSI=46 -DTFT_SCLK=46
    -DTFT_CS=46 -DTFT_DC=46 -DTFT_RST=-1 -DTOUCH_CS=-1
    -DLOAD_GLCD=1 -DSPI_FREQUENCY=27000000
    -DBQ25730_TEST
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I./include
    -I./include/config
    -I./include/protocol
    -I./include/tasks
    -Isrc/drivers
    -Wno-attributes
build_src_filter = +<*> -<hal/hal_hw16.cpp>

[env:native]
platform = native
test_framework = unity
extra_scripts = pre:pre_native.py
build_flags =
    -std=c++17
    -DNATIVE_TEST
    -I./src
    -I../shared/include
; The native platform's LDF does not compile ../shared/src even via the
; symlink:// lib (headers resolve through the -I flag first) — pre_native.py
; compiles shared/src explicitly for this env instead.
lib_deps = symlink://../shared
test_build_src = yes
build_src_filter =
    +<modules/control/alarm_machine.cpp>
    +<modules/control/alarm_window.cpp>
    +<modules/control/alarm_history.cpp>
    +<modules/control/alarm_test.cpp>
    +<modules/control/pid_wrapper.cpp>
    +<modules/baby_profile/baby_profile_core.cpp>
    +<modules/baby_profile/baby_profile_protocol.cpp>
    +<modules/util/civil_time.cpp>
    +<modules/baby_profile/baby_cloud.cpp>
