[common]
platform = espressif32@6.6.0
framework = arduino
board = esp32-s3-devkitc-1
board_build.partitions = partitions/ESP32S3_8MB.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_encoding = UTF-8
build_type = debug
debug_tool = esp-prog
debug_init_break = tbreak setup
; NOTE: lib_extra_dirs = ../shared treats shared/'s SUBFOLDERS (include/,
; src/) as candidate libraries — headers resolved via an anonymous "include"
; pseudo-lib, but shared/src/*.cpp never got compiled/linked. symlink:// makes
; shared/ itself the library so library.json (srcDir=src) is honored.
;
; NOTE: incunest_afe4490 is pinned to a commit, not to #master. It lives in
; another repo with another owner, so #master meant his work in progress
; landed in this firmware on any fresh install (new clone, new worktree, CI)
; without either side deciding it — that is how the v0.69 int32_t -> float
; change to ppg_disp reached us silently. Bumping the pin is the deliberate
; handshake; SPO2.h's static_assert catches a data-contract break at the bump.
; Pin to a tag (#v0.81) instead once the library repo tags its releases —
; its tags currently stop at v0.18 while library.json reads 0.81.0.
; 2026-09-01: pineadas al commit que ya estaba instalado/compilado en este
; workspace (mismo criterio que incunest_afe4490 — congela lo que ya corre,
; no introduce comportamiento nuevo). Quedan sin pinear deliberadamente:
; ArduinoStreamUtils/StreamDebugger (bajo riesgo, sin revisar todavía).
;
; NOTE: ricemices/ArduinoHttpClient se retiró de lib_deps (era un fork
; congelado en abril de 2022, comparado en GitHub contra arduino-libraries/
; ArduinoHttpClient: "up to date with all commits from ricemices:master",
; cero commits propios). Ambos declaran name=ArduinoHttpClient en su
; library.properties, así que tenerlos a la vez era ambigüedad de build real,
; no redundancia inocua: el LDF podía resolver #include <ArduinoHttpClient.h>
; contra cualquiera de los dos, incluyendo silenciosamente el fork más viejo
; en vez del arduino-libraries/ArduinoHttpClient que se pinea más abajo (con
; el fix de overflow de iContentLength de v0.6.1 ya incluido).
;
; NOTE: NO subir thingsboard-arduino-sdk a v0.15.0 (ni a #master): su propio
; ThingsBoard.h:289 llama a IMQTT_Client::get_buffer_size(), un método que la
; interfaz ya no declara (se partió en get_receive_buffer_size()/
; get_send_buffer_size() al pasar TBPubSubClient a buffers TX/RX separados en
; TBPubSubClient>=2.10) — no compila con ningún IMQTT_Client, es un bug propio
; del SDK, no de nuestra elección de versión (verificado compilando contra
; v0.15.0 y contra #master: mismo fallo en ambos). v0.14.0 sí compila pero aún
; usa la API de un solo buffer, igual que v0.13.0 — no aporta nada. Mientras
; esto no se arregle upstream, TBPubSubClient@2.9.4 vía git es la solución
; definitiva (no temporal): el tag sigue existiendo en GitHub aunque
; desapareciera del registro de PlatformIO.
lib_deps =
  symlink://../shared
  https://github.com/br3ttb/Arduino-PID-Library.git#524a4268fc01e6ea397e7fc5b5d820741e9b662f
  https://github.com/mathertel/RotaryEncoder.git#434dc95db50a520802d9d663a467bc788f76e5a8  ; v1.6.0
  https://github.com/adafruit/Adafruit-GFX-Library.git#ac6d7c3869a693d406f77b9bfcd486b0673169f0  ; 1.12.6
  adafruit/Adafruit BusIO@1.17.4
  https://github.com/sparkfun/SparkFun_SHTC3_Arduino_Library.git#671ef7e7c3570b2082a4ebbb8a63ea37cc13d171
  https://github.com/thingsboard/thingsboard-arduino-sdk.git#v0.13.0
  https://github.com/bblanchon/ArduinoStreamUtils.git
  https://github.com/vshymanskyy/TinyGSM.git#4c552105acb42686ed2f99e5e75f0e67b5cb7ff9
  https://github.com/vshymanskyy/StreamDebugger.git
  https://github.com/RobTillaart/TCA9555.git#8f8ade2d9d8680be8b1a8692ee38094b626ea06b  ; v0.4.4
  https://github.com/adafruit/Adafruit_SHT4X.git#76a06edfa280a699da1c2f311bdeccb0bd5cee92  ; v1.0.5
  https://github.com/tttapa/Arduino-Filters.git#a11a239a890b6a41006679c4a235ba6b91b3e883
  https://github.com/medicalopenworld/incunest_afe4490.git#4e0dd91  ; v0.81.0
  https://github.com/arduino-libraries/ArduinoHttpClient.git#d9d40d9e1f97db1eca348c662565a85109508d34
  https://github.com/Bodmer/TFT_eSPI.git#16e37595040eac69cd628e4bffb56fc30cad6299  ; post-V2.5.43
  https://github.com/Sensirion/arduino-i2c-sts3x.git#3f2b2040b6c5298072ded821a916678680107233
  https://github.com/beast-devices/Arduino-INA3221.git#5861b747a82ca6082b12c9a448d3b5a1dc76801f
  bblanchon/ArduinoJson@6.21.5
  https://github.com/thingsboard/pubsubclient.git#v2.9.4

[env:IncuNest_V18]
extends = common
build_flags =
    -DHW_NUM=18
    -DCORE_DEBUG_LEVEL=3
    -g3 -O0

    -DUSER_SETUP_LOADED=1
    -DTFT_INVERSION_ON=1
    -DILI9341_2_DRIVER=1
    -DTFT_MISO=46 -DTFT_MOSI=46 -DTFT_SCLK=46
    -DTFT_CS=46 -DTFT_DC=46 -DTFT_RST=-1 -DTOUCH_CS=-1
    -DLOAD_GLCD=1 -DSPI_FREQUENCY=27000000
    -DBQ25730_TEST
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I./include
    -I./include/config
    -I./include/protocol
    -I./include/tasks
    -Isrc/drivers
    -Wno-attributes
build_src_filter = +<*> -<hal/hal_hw16.cpp>

[env:IncuNest_V17]
extends = common
build_flags =
    -DHW_NUM=17
    -DCORE_DEBUG_LEVEL=3
    -g3 -O0

    -DUSER_SETUP_LOADED=1
    -DTFT_INVERSION_ON=1
    -DILI9341_2_DRIVER=1
    -DTFT_MISO=46 -DTFT_MOSI=46 -DTFT_SCLK=46
    -DTFT_CS=46 -DTFT_DC=46 -DTFT_RST=-1 -DTOUCH_CS=-1
    -DLOAD_GLCD=1 -DSPI_FREQUENCY=27000000
    -DBQ25730_TEST
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I./include
    -I./include/config
    -I./include/protocol
    -I./include/tasks
    -Isrc/drivers
    -Wno-attributes
build_src_filter = +<*> -<hal/hal_hw16.cpp>

[env:native]
platform = native
test_framework = unity
extra_scripts = pre:pre_native.py
build_flags =
    -std=c++17
    -DNATIVE_TEST
    -I./src
    -I../shared/include
; The native platform's LDF does not compile ../shared/src even via the
; symlink:// lib (headers resolve through the -I flag first) — pre_native.py
; compiles shared/src explicitly for this env instead.
lib_deps = symlink://../shared
test_build_src = yes
build_src_filter =
    +<modules/control/alarm_machine.cpp>
    +<modules/control/alarm_window.cpp>
    +<modules/control/alarm_history.cpp>
    +<modules/control/alarm_test.cpp>
    +<modules/control/pid_wrapper.cpp>
    +<modules/baby_profile/baby_profile_core.cpp>
    +<modules/baby_profile/baby_profile_protocol.cpp>
    +<modules/util/civil_time.cpp>
    +<modules/util/tz_source.cpp>
    +<modules/baby_profile/baby_cloud.cpp>
