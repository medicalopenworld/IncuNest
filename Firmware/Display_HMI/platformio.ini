; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
boards_dir = .

[env:main]
; Migrado a Arduino 3.x / ESP-IDF 5.3 (pioarduino) para fix de DMA RGB LCD
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Memory Configuration for CrowPanel 7.0 (16MB Flash / 8MB PSRAM OPI)
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = IncuNest_display_v1_audio.csv

build_flags =
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-I./include
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3  ; 0 = NONE, 1 = ERROR, 2 = WARN, 3 = INFO
    ;-D ARDUINO_USB_CDC_ON_BOOT=1 ; Uncomment if using USB-C Serial
build_src_filter = +<*> -<AudioManager.cpp>
lib_ignore = ArduinoHttpClient
monitor_speed = 115200

lib_deps = 
	; tamctec/TAMC_GT911@^1.0.2 ; Removed to use local fixed version
    ; ./lib/TAMC_GT911_Fixed ; Auto-detected in lib folder
	; moononournation/GFX Library for Arduino@1.2.8  ; No compatible con ESP-IDF 5.x, no se usa
	; lovyan03/LovyanGFX — REEMPLAZADO por esp_lcd nativo con bounce buffers
	maxpromer/PCA9557-arduino@^1.0.0
	; adafruit/Adafruit GFX Library@^1.11.9  ; No se usa directamente
	lvgl/lvgl@^8.3.11
	https://github.com/thingsboard/thingsboard-arduino-sdk.git#v0.13.0
	; NOTA: ThingsBoard compila Arduino_HTTP_Client.cpp que necesita ArduinoHttpClient.
	; Se excluye vía extra_scripts abajo.
 	https://github.com/bblanchon/ArduinoStreamUtils.git
	https://github.com/vshymanskyy/StreamDebugger.git
	https://github.com/arduino-libraries/ArduinoMqttClient.git
	; https://github.com/ricemices/ArduinoHttpClient.git  ; Incompatible Arduino 3.x, no se usa (solo MQTT)
	bblanchon/ArduinoJson@6.21.5
  	thingsboard/TBPubSubClient@2.9.4
    ; esphome/ESP32-audioI2S @ ^2.0.7  ; Deshabilitado para migración Arduino 3.x
