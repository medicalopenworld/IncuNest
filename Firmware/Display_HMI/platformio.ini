; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
boards_dir = .
core_dir = C:\pio
build_dir = C:\pio\.bld

[env:main]
platform = espressif32
board = esp32-s3-devkitc-1-myboard
framework = arduino
platform_packages = framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32#2.0.3
build_flags = 
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-I./include
	-DCORE_DEBUG_LEVEL=5
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_type = debug
debug_tool = esp-prog
debug_init_break = tbreak setup
lib_deps = 
	tamctec/TAMC_GT911@^1.0.2
	moononournation/GFX Library for Arduino@1.2.8
	lovyan03/LovyanGFX@^1.1.12
	maxpromer/PCA9557-arduino@^1.0.0
	adafruit/Adafruit GFX Library@^1.11.9
	lvgl/lvgl@^8.3.11
	https://github.com/thingsboard/thingsboard-arduino-sdk.git#v0.13.0
 	https://github.com/bblanchon/ArduinoStreamUtils.git
	https://github.com/vshymanskyy/StreamDebugger.git
	https://github.com/arduino-libraries/ArduinoMqttClient.git
	https://github.com/ricemices/ArduinoHttpClient.git
	bblanchon/ArduinoJson@6.21.5
  	thingsboard/TBPubSubClient@2.9.4
board_build.partitions = IncuNest_display_v0.csv
