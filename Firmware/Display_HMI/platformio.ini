; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
boards_dir = .
default_envs = main

; -------------------------------------------------------
; Shared settings — inherited by all environments
; -------------------------------------------------------
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; CrowPanel 7.0 — 16MB Flash / 8MB PSRAM OPI
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = partitions/display_v1_audio.csv

monitor_speed = 115200
build_src_filter = +<*> -<tasks/AudioManager.cpp>
lib_ignore = ArduinoHttpClient

lib_deps =
    maxpromer/PCA9557-arduino@^1.0.0
    lvgl/lvgl@^8.3.11
    https://github.com/thingsboard/thingsboard-arduino-sdk.git#v0.13.0
    https://github.com/bblanchon/ArduinoStreamUtils.git
    https://github.com/vshymanskyy/StreamDebugger.git
    https://github.com/arduino-libraries/ArduinoMqttClient.git
    bblanchon/ArduinoJson@6.21.5
    thingsboard/TBPubSubClient@2.9.4

lib_extra_dirs = ../shared

; -------------------------------------------------------
; Production build  — "pio run" or "pio run -e main"
; -------------------------------------------------------
[env:main]
build_flags =
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I./include
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
    ;-D ARDUINO_USB_CDC_ON_BOOT=1
    ;-D CRASH_TEST_HMI=1           ; 1=null-ptr panic, 2=abort()
    ;-D CRASH_TEST_HMI_DELAY_S=30  ; seconds before crash fires

; -------------------------------------------------------
; Crash-recovery test  — "pio run -e crash_test_hmi"
; -------------------------------------------------------
[env:crash_test_hmi]
build_flags =
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I./include
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
    -D CRASH_TEST_HMI=1
    -D CRASH_TEST_HMI_DELAY_S=30
