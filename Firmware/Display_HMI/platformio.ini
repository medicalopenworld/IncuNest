; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
boards_dir = .
default_envs = main

; -------------------------------------------------------
; Shared settings — inherited by all environments
; -------------------------------------------------------
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; CrowPanel 7.0 — 16MB Flash / 8MB PSRAM OPI
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions/hmi_16mb_ota.csv

; TODO (medida 2, pendiente — ver PR/commit): mitigar contención de SPI0 con
; CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y / CONFIG_SPIRAM_RODATA=y (recomendación
; oficial de Espressif para "LCD screen drift" en paneles RGB con framebuffer
; en PSRAM, ver esp-idf/examples/peripherals/lcd/rgb_panel/README.md).
; Bloqueado en este equipo: pioarduino's custom_sdkconfig fuerza el modo
; "Arduino como componente IDF" (recompila desde fuente), y ese flujo invoca
; CMake/Ninja contra C:\msys64\mingw64\bin\cc.exe para la detección de ABI
; del compilador HOST — falla ahí ("C compiler ... broken") aunque el mismo
; cc.exe compila bien invocado a mano fuera de ninja. Descartado que sea el
; CMakeLists.txt vestigial del proyecto (se probó moviéndolo aparte: mismo
; fallo, mismo stack en framework-espidf/tools/cmake/project.cmake). Es un
; problema de entorno MSYS2/CMake/Ninja en esta máquina, no del firmware.
; NO activar CONFIG_LCD_RGB_ISR_IRAM_SAFE aparte: con num_fbs=1 el relleno
; del bounce buffer lee el framebuffer vía memcpy desde PSRAM, cuya cache
; queda igualmente suspendida durante una operación de flash — activarlo sin
; más cambios provocaría un panic "Cache disabled but cached memory region
; accessed" (reset) en vez del parpadeo benigno actual.

monitor_speed = 115200
build_src_filter = +<*> -<tasks/AudioManager.cpp>
lib_ignore = ArduinoHttpClient

; NOTE: lib_extra_dirs = ../shared treats shared/'s SUBFOLDERS (include/,
; src/) as candidate libraries — headers resolved via an anonymous "include"
; pseudo-lib, but shared/src/*.cpp never got compiled/linked. symlink:// makes
; shared/ itself the library so library.json (srcDir=src) is honored (same
; fix as motherBoard/platformio.ini).
lib_deps =
    symlink://../shared
    maxpromer/PCA9557-arduino@^1.0.0
    lvgl/lvgl@^8.3.11
    https://github.com/thingsboard/thingsboard-arduino-sdk.git#v0.13.0
    https://github.com/bblanchon/ArduinoStreamUtils.git
    https://github.com/vshymanskyy/StreamDebugger.git
    https://github.com/arduino-libraries/ArduinoMqttClient.git
    bblanchon/ArduinoJson@6.21.5
    https://github.com/thingsboard/pubsubclient.git#v2.9.4
    EEPROM

; -------------------------------------------------------
; Production build  — "pio run" or "pio run -e main"
; -------------------------------------------------------
[env:main]
build_flags =
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I./include
    -I./include/config
    -I./include/protocol
    -I./include/tasks
    -I./include/ui
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
    -D THINGSBOARD_ENABLE_STREAM_UTILS=0
    -D NETWORK_EVENTS_MUTEX
    ;-D ARDUINO_USB_CDC_ON_BOOT=1
    ;-D CRASH_TEST_HMI=1           ; 1=null-ptr panic, 2=abort()
    ;-D CRASH_TEST_HMI_DELAY_S=30  ; seconds before crash fires

; -------------------------------------------------------
; Crash-recovery test  — "pio run -e crash_test_hmi"
; -------------------------------------------------------
[env:crash_test_hmi]
build_flags =
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I./include
    -I./include/config
    -I./include/protocol
    -I./include/tasks
    -I./include/ui
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
    -D THINGSBOARD_ENABLE_STREAM_UTILS=0
    -D NETWORK_EVENTS_MUTEX
    -D CRASH_TEST_HMI=1
    -D CRASH_TEST_HMI_DELAY_S=30

; -------------------------------------------------------
; Bench debug — WiFi/OTA task deshabilitado por completo
; (control A/B para aislar el glitching LCD del stack WiFi).
; "pio run -e wifi_off_test -t upload --upload-port COMx"
; -------------------------------------------------------
[env:wifi_off_test]
build_flags =
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I./include
    -I./include/config
    -I./include/protocol
    -I./include/tasks
    -I./include/ui
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
    -D THINGSBOARD_ENABLE_STREAM_UTILS=0
    -D NETWORK_EVENTS_MUTEX
    -D DISABLE_WIFI_TEST=1
