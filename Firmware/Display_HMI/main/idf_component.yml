## Dependencias gestionadas del HMI.
##
## Sustituyen a lib_deps de platformio.ini. Las que no aparecen aqui es porque
## el porte las elimina (eran envoltorios de Arduino) o las reescribe sobre
## components/incunest_platform.
dependencies:
  idf:
    version: ">=5.3"

  ## LVGL 8.3. Se mantiene la serie 8.x a proposito: el arbol de src/ui son
  ## ~14.700 lineas escritas contra la API 8 (lv_disp_drv_t, lv_indev_drv_t...),
  ## que LVGL 9 rompe entera. Subir de mayor es un proyecto aparte, no parte de
  ## un cambio de toolchain.
  lvgl/lvgl:
    version: "~8.3.11"

  ## esp-mqtt. En ESP-IDF 6 dejo de venir dentro del arbol de IDF y pasa al
  ## registro de componentes como espressif/mqtt (components/mqtt en la
  ## instalacion local solo conserva un test_apps vacio, de ahi el aviso
  ## "does not contain a CMakeLists.txt" al configurar).
  espressif/mqtt:
    version: "^1.1.0"
    require: public

  ## SDK de ThingsBoard. NO ES UN VENDORIZADO: el proyecto upstream ya trae
  ## CMakeLists.txt e idf_component.yml, y publica en el registro. Lo unico
  ## que cambia frente a PlatformIO es que el transporte pasa a ser
  ## Espressif_MQTT_Client (esp-mqtt) en vez de Arduino_MQTT_Client
  ## (PubSubClient). Los ficheros Arduino_*.cpp del SDK se compilan igual pero
  ## su contenido esta bajo #ifdef ARDUINO, asi que quedan vacios.
  ##
  ## PINEADO EN =0.13.0, NO "^". El motivo esta documentado en el
  ## platformio.ini original y sigue vigente: v0.15.0 no compila con NINGUN
  ## IMQTT_Client porque su propio ThingsBoard.h llama a get_buffer_size(),
  ## un metodo que la interfaz ya no declara (se partio en
  ## get_receive_buffer_size()/get_send_buffer_size()). Es un bug del SDK, no
  ## de nuestra eleccion de version. v0.14.0 compila pero sigue con la API de
  ## un solo bufer, igual que 0.13.0: no aporta nada.
  thingsboard/thingsboard:
    version: "=0.13.0"

  ## ArduinoJson 6.x. El SDK de ThingsBoard pide ^6.21.4 y el firmware pinea
  ## 6.21.5. Se queda en la serie 6 a proposito: la 7 cambia la API entera
  ## (JsonDocument sin tamano, StaticJsonDocument eliminado) y la usan tanto
  ## el SDK como el codec del enlace con la placa.
  bblanchon/arduinojson:
    version: "~6.21.5"

  ## mDNS, que sustituye a ESPmDNS de Arduino. Tambien salio del arbol de IDF.
  espressif/mdns:
    version: "^1.8.0"
